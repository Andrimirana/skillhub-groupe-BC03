# Server
server.port=8080
server.tomcat.reject-illegal-header=false

# MySQL — connexion Docker (db = hostname du service MySQL dans le réseau Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/skillhub_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:skillhub_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:skillhub_pass}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Master Key AES-256-GCM — injectée via APP_MASTER_KEY (jamais en dur ici)
app.master-key=${APP_MASTER_KEY:}

# Clé de signature JWT HS256 — injectée via JWT_SECRET en production
# La valeur par défaut est réservée au développement local uniquement
jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production}

# Logs
logging.file.name=logs/auth.log
logging.level.com.example.auth=INFO
logging.level.org.springframework.security=WARN

