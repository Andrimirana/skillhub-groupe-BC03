name: Quality checks

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  frontend:
    name: Frontend React
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  laravel:
    name: Laravel services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - catalog
          - inscription
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd, mongodb-1.21.0
          coverage: xdebug

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        working-directory: services/${{ matrix.service }}
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite

      - name: Validate syntax
        working-directory: services/${{ matrix.service }}
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          XDEBUG_MODE: coverage
        run: |
          composer validate --no-check-publish --no-check-lock
          find app routes database tests -name "*.php" -print0 | xargs -0 -n1 php -l

  spring:
    name: Spring Boot auth service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: services/auth-java/pom.xml

      - name: Verify
        working-directory: services/auth-java
        run: |
          chmod +x ./mvnw
          ./mvnw -q -DskipTests compile

  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    needs:
      - frontend
      - laravel
      - spring
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: services/auth-java/pom.xml

      - name: Compile Java classes for analysis
        working-directory: services/auth-java
        run: |
          chmod +x ./mvnw
          ./mvnw -q -DskipTests compile

      - name: Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          args: >
            -Dsonar.scanner.skipJreProvisioning=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs:
      - frontend
      - laravel
      - spring
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: skillhub-frontend:latest

      - name: Build auth image
        uses: docker/build-push-action@v6
        with:
          context: ./services/auth-java
          push: false
          tags: skillhub-auth:latest

      - name: Build catalog image
        uses: docker/build-push-action@v6
        with:
          context: ./services/catalog
          push: false
          tags: skillhub-catalog:latest

      - name: Build inscription image
        uses: docker/build-push-action@v6
        with:
          context: ./services/inscription
          push: false
          tags: skillhub-inscription:latest
