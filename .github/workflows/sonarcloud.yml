name: Contrôles qualité

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  frontend:
    name: Interface React
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Vérifier le code
        working-directory: frontend
        run: npm run lint

      - name: Compiler l’interface
        working-directory: frontend
        run: npm run build

  laravel:
    name: Services Laravel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - catalog
          - inscription
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd, mongodb-1.21.0
          coverage: xdebug

      - name: Installer les dépendances
        working-directory: services/${{ matrix.service }}
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l’environnement
        working-directory: services/${{ matrix.service }}
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite

      - name: Vérifier la syntaxe
        working-directory: services/${{ matrix.service }}
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          XDEBUG_MODE: coverage
        run: |
          composer validate --no-check-publish --no-check-lock
          find app routes database tests -name "*.php" -print0 | xargs -0 -n1 php -l

  spring:
    name: Service auth Spring Boot
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: services/auth-java/pom.xml

      - name: Vérifier le service
        working-directory: services/auth-java
        run: |
          chmod +x ./mvnw
          ./mvnw -q verify

  sonarcloud:
    name: Analyse SonarCloud
    runs-on: ubuntu-latest
    needs:
      - frontend
      - laravel
      - spring
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Préparer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: services/auth-java/pom.xml

      - name: Tester Java avec couverture
        working-directory: services/auth-java
        run: |
          chmod +x ./mvnw
          ./mvnw -q verify

      - name: Analyser le code
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          args: >
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs:
      - frontend
      - laravel
      - spring
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l’image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: skillhub-frontend:latest

      - name: Construire l’image auth
        uses: docker/build-push-action@v6
        with:
          context: ./services/auth-java
          push: false
          tags: skillhub-auth:latest

      - name: Construire l’image catalogue
        uses: docker/build-push-action@v6
        with:
          context: ./services/catalog
          push: false
          tags: skillhub-catalog:latest

      - name: Construire l’image inscription
        uses: docker/build-push-action@v6
        with:
          context: ./services/inscription
          push: false
          tags: skillhub-inscription:latest
